services:
  nx-cast-build:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: devkitpro/devkita64:latest
      pull: true
    working_dir: /workspace
    environment:
      DEVKITPRO: /opt/devkitpro
    volumes:
      - ./:/workspace
    command: bash -lc "make release-build"
