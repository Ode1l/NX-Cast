name: Candidate latest media toolchain

# Deliberately separate from Build/Release until hardware validation passes.
on:
  workflow_dispatch:
  push:
    branches: [codex/toolchain-candidate]
    paths:
      - '.github/workflows/toolchain-candidate.yml'
      - 'Dockerfile.candidate'
      - '.dockerignore'
      - 'scripts/build_switch_mpv_candidate.sh'
      - 'scripts/mpv_switch_cross.patch'
      - 'scripts/libuam_switch_cross.ini'
      - 'scripts/build_switch_ffmpeg_airplay.sh'
      - 'scripts/ffmpeg_switch_random.patch'
      - 'scripts/ffmpeg_nvtegra_long_ref.patch'
      - 'scripts/verify_switch_ffmpeg_airplay.sh'

permissions:
  contents: read
  packages: write

concurrency:
  group: candidate-toolchain-${{ github.repository }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest base and candidate cache
        id: resolve
        env:
          RECIPE_HASH: ${{ hashFiles('Dockerfile.candidate', '.dockerignore', 'scripts/build_switch_mpv_candidate.sh', 'scripts/mpv_switch_cross.patch', 'scripts/libuam_switch_cross.ini', 'scripts/build_switch_ffmpeg_airplay.sh', 'scripts/ffmpeg_switch_random.patch', 'scripts/ffmpeg_nvtegra_long_ref.patch', 'scripts/verify_switch_ffmpeg_airplay.sh', '.github/workflows/toolchain-candidate.yml') }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect devkitpro/devkita64:latest --format '{{json .Manifest}}' | jq -er '.digest')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          base="devkitpro/devkita64@${digest}"
          key=$(printf '%s\n%s\n' "$digest" "$RECIPE_HASH" | sha256sum | cut -d ' ' -f1)
          image="ghcr.io/${GITHUB_REPOSITORY,,}-toolchain-candidate:${key}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          printf 'Base: `%s`\n\nCandidate: `%s`\n' "$base" "$image" >> "$GITHUB_STEP_SUMMARY"
          if docker manifest inspect "$image" > /dev/null; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build source-based candidate image
        if: steps.resolve.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.candidate
          build-args: BASE_IMAGE=${{ steps.resolve.outputs.base }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.resolve.outputs.image }}
          cache-from: type=gha,scope=nxcast-candidate
          cache-to: type=gha,mode=max,scope=nxcast-candidate

      - name: Build candidate application without publishing a release
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace "$IMAGE" \
            bash -lc 'set -euo pipefail; make RELEASE_JOBS=4 release-build; ./scripts/package_release.sh; cp -r /opt/nxcast-toolchain dist/toolchain-info'

      - uses: actions/upload-artifact@v4
        with:
          name: NX-Cast-candidate-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/NX-Cast-sdmc.zip
            dist/toolchain-info/
            NX-Cast.elf
