name: Candidate latest media toolchain

# Exercise the shared production path without creating a release.
on:
  workflow_dispatch:
  push:
    branches: [codex/toolchain-candidate]
    paths:
      - '.github/workflows/toolchain-candidate.yml'
      - '.github/workflows/toolchain.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'scripts/build_switch_mpv_candidate.sh'
      - 'scripts/mpv_switch_cross.patch'
      - 'scripts/libuam_switch_cross.ini'
      - 'scripts/build_switch_ffmpeg_airplay.sh'
      - 'scripts/ffmpeg_switch_random.patch'
      - 'scripts/ffmpeg_nvtegra_long_ref.patch'
      - 'scripts/verify_switch_ffmpeg_airplay.sh'

permissions:
  contents: read
  packages: write

concurrency:
  group: candidate-toolchain-${{ github.repository }}
  cancel-in-progress: false

jobs:
  toolchain:
    uses: ./.github/workflows/toolchain.yml

  candidate:
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build candidate application without publishing a release
        env:
          IMAGE: ${{ needs.toolchain.outputs.image }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace "$IMAGE" \
            bash -lc 'set -euo pipefail; host_pc="/usr/lib/$(gcc -print-multiarch)/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig"; PKG_CONFIG_PATH="${host_pc}" make test-airplay; make RELEASE_JOBS=4 release-build; ./scripts/package_release.sh; cp -r /opt/nxcast-toolchain dist/toolchain-info'

      - uses: actions/upload-artifact@v4
        with:
          name: NX-Cast-candidate-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/NX-Cast-sdmc.zip
            dist/toolchain-info/
            NX-Cast.elf
