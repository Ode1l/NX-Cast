name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain:
    uses: ./.github/workflows/toolchain.yml

  release:
    needs: toolchain
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN_IMAGE: ${{ needs.toolchain.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build NX-Cast in devkitPro container
        run: |
          docker run --rm \
            -e DEVKITPRO=/opt/devkitpro \
            -e NXCAST_MIN_NRO_SIZE=5000000 \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            "${TOOLCHAIN_IMAGE}" \
            bash -lc 'set -euo pipefail; /usr/local/bin/verify_switch_ffmpeg_airplay.sh /opt/devkitpro/portlibs/switch; make RELEASE_JOBS=$(nproc) release-build'

      - name: Package SD card layout
        env:
          NXCAST_MIN_NRO_SIZE: 5000000
        run: ./scripts/package_release.sh

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          name: NX-Cast ${{ github.ref_name }} - DLNA + IPTV + Experimental AirPlay
          body_path: .github/release-notes.md
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/NX-Cast.nro
            dist/NX-Cast-sdmc.zip
