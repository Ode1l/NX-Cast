name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NXCAST_MPV_VARIANT: deko3d
  WILIWILI_RELEASE: v0.1.0
  LIBUAM_PKG: libuam-f8c9eef01ffe06334d530393d636d69e2b52744b-1-any.pkg.tar.zst
  SWITCH_FFMPEG_PKG: switch-ffmpeg-7.1-1-any.pkg.tar.zst
  SWITCH_LIBMPV_PKG: switch-libmpv_deko3d-0.36.0-2-any.pkg.tar.zst
  NXCAST_FFMPEG_JOBS: 4

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build project image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nx-cast-build:ci
          build-args: |
            NXCAST_MPV_VARIANT=${{ env.NXCAST_MPV_VARIANT }}
            WILIWILI_RELEASE=${{ env.WILIWILI_RELEASE }}
            LIBUAM_PKG=${{ env.LIBUAM_PKG }}
            SWITCH_FFMPEG_PKG=${{ env.SWITCH_FFMPEG_PKG }}
            SWITCH_LIBMPV_PKG=${{ env.SWITCH_LIBMPV_PKG }}
            NXCAST_FFMPEG_JOBS=${{ env.NXCAST_FFMPEG_JOBS }}
          cache-from: type=gha,scope=nx-cast-toolchain
          cache-to: type=gha,mode=max,scope=nx-cast-toolchain

      - name: Build NX-Cast in devkitPro container
        run: |
          docker run --rm \
            -e DEVKITPRO=/opt/devkitpro \
            -e NXCAST_MIN_NRO_SIZE=5000000 \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            nx-cast-build:ci \
            bash -lc 'set -euo pipefail; /usr/local/bin/verify_switch_ffmpeg_airplay.sh /opt/devkitpro/portlibs/switch; make RELEASE_JOBS=$(nproc) release-build'

      - name: Package SD card layout
        env:
          NXCAST_MIN_NRO_SIZE: 5000000
        run: ./scripts/package_release.sh

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          name: NX-Cast ${{ github.ref_name }} - DLNA + IPTV + Experimental AirPlay
          body_path: .github/release-notes.md
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/NX-Cast.nro
            dist/NX-Cast-sdmc.zip
