name: Switch toolchain

on:
  workflow_call:
    outputs:
      image:
        description: Versioned Switch toolchain image
        value: ${{ jobs.toolchain.outputs.image }}
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  toolchain:
    runs-on: ubuntu-latest
    concurrency:
      group: switch-toolchain-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve toolchain version
        id: resolve
        env:
          TOOLCHAIN_HASH: ${{ hashFiles('Dockerfile', '.dockerignore', 'scripts/fetch_switch_ffmpeg_airplay.sh', 'scripts/build_switch_ffmpeg_airplay.sh', 'scripts/ffmpeg_switch_random.patch', 'scripts/verify_switch_ffmpeg_airplay.sh', '.github/workflows/toolchain.yml') }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-toolchain:${TOOLCHAIN_HASH}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$image" > /dev/null 2> /tmp/toolchain-manifest-error; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            cat /tmp/toolchain-manifest-error >&2
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.resolve.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Publish toolchain
        if: steps.resolve.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.resolve.outputs.image }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=nx-cast-toolchain
          cache-to: type=gha,mode=max,scope=nx-cast-toolchain
